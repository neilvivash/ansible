- name: Upgrade FOG Server
  hosts: fog_server
  become: true
  vars:
    fog_installed: false  # Default flag to check if FOG is installed
    fog_version_required: "1.5.10.1634"  # The target version to install

  tasks:

    # Step 1: Check if FOG is installed (by checking .fogsettings file)
    - name: Check if FOG is installed
      stat:
        path: /opt/fog/.fogsettings
      register: fog_installed_check

    # Step 2: Set fact if FOG is already installed
    - name: Set fog_installed to true if FOG is already installed
      set_fact:
        fog_installed: "{{ fog_installed_check.stat.exists }}"

    # Step 3: Verify currently installed FOG version
    - name: Verify current FOG version
      shell: "grep -Po '(?<=## Version: )\\S+' /opt/fog/.fogsettings || echo 'Not Found'"
      register: fog_current_version
      changed_when: false
      failed_when: false
      when: fog_installed

    - name: Display currently installed FOG version
      debug:
        msg: "Current FOG Server version: {{ fog_current_version.stdout }}"
      when: fog_installed

    # Step 4: Backup FOG settings (if already installed)
    - name: Backup current FOG settings
      shell: tar -czf /root/fog_backup_$(date +%F).tar.gz /opt/fog /etc/apache2 /var/www/fog
      register: backup_status
      when: fog_installed
      args:
        creates: "/root/fog_backup_$(date +%F).tar.gz"

    - name: Display backup status
      debug:
        var: backup_status.stdout_lines
      when: fog_installed

    # Step 5: Ensure required dependencies are installed
    - name: Install required dependencies
      package:
        name:
          - git
          - curl
          - wget
          - lsb-release
          - apache2
          - php
          - mariadb-server
        state: present

    # Step 6: Download the specific FOG version 1.5.10.1634
    - name: Download specific FOG version (1.5.10.1634)
      git:
        repo: "https://github.com/FOGProject/fogproject.git"
        dest: "/root/fog_latest"
        version: "1.5.10.1634"
        force: yes

    # Step 7: Run the FOG installer
    - name: Run the FOG installer
      shell: "./installfog.sh -Y"
      args:
        chdir: "/root/fog_latest/bin"
      async: 1800  # Allow up to 30 minutes for installation
      poll: 0
      register: fog_install_status

    - name: Wait for FOG installation to complete
      async_status:
        jid: "{{ fog_install_status.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 60
      delay: 30

    # Step 8: Verify FOG installation
    - name: Verify new FOG version
      shell: "grep -Po '(?<=## Version: )\\S+' /opt/fog/.fogsettings || echo 'Not Found'"
      register: new_fog_version
      changed_when: false
      failed_when: false

    - name: Display new FOG version
      debug:
        msg: "Newly installed FOG version: {{ new_fog_version.stdout }}"

    - name: Fail if FOG version is incorrect
      fail:
        msg: "FOG installation failed! Expected version: {{ fog_version_required }}, but got: {{ new_fog_version.stdout }}"
      when: new_fog_version.stdout != fog_version_required

    # Step 9: Restart necessary services
    - name: Restart Apache web server
      service:
        name: apache2
        state: restarted

    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted

    - name: Restart FOG services
      service:
        name: "{{ item }}"
        state: restarted
      loop:
        - FOGMulticastManager
        - FOGScheduler
        - FOGImageReplicator
        - FOGSnapinReplicator
        - FOGSnapinHash

