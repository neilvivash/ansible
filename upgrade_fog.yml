- name: Upgrade FOG Server
  hosts: fog_server
  become: true
  vars:
    fog_installed: false  # Default flag to check if FOG is installed

  tasks:

    # Step 1: Check if FOG is already installed (by checking for .fogsettings)
    - name: Check if FOG is installed
      shell: "if [ -f /opt/fog/.fogsettings ]; then echo 'FOG installed'; else echo 'FOG not installed'; fi"
      register: fog_installed_check
      changed_when: false
      failed_when: false

    # Step 2: Set fog_installed to true if FOG is already installed
    - name: Set fog_installed to true if FOG is already installed
      set_fact:
        fog_installed: true
      when: "'FOG installed' in fog_installed_check.stdout"

    # Step 3: Backup current FOG settings (only if not installed yet)
    - name: Backup current FOG settings
      shell: tar -czf /root/fog_backup_$(date +%F).tar.gz /opt/fog /etc/apache2 /var/www/fog
      register: backup_status
      when: not fog_installed
      args:
        creates: "/root/fog_backup_$(date +%F).tar.gz"

    - name: Display backup status
      debug:
        var: backup_status.stdout_lines
      when: not fog_installed

    # Step 4: Ensure required dependencies are installed (skip if FOG is installed)
    - name: Ensure required dependencies are installed
      package:
        name:
          - git
          - curl
          - wget
          - lsb-release
          - apache2
          - php
        state: present
      when: fog_installed

    # Step 5: Download the latest FOG installer if needed (use version 1.5.10.1634)
    - name: Download latest FOG installer
      git:
        repo: "https://github.com/FOGProject/fogproject.git"
        dest: "/root/fog_latest"
        version: "1.5.10-1634"  # Use the specific tag for version 1.5.10.1634
        force: yes
      when: not fog_installed

    # Step 6: Run the FOG installer (skip if FOG is already installed)
    - name: Run the FOG installer
      shell: "cd /root/fog_latest/bin && ./installfog.sh -Y"
      args:
        chdir: "/root/fog_latest/bin"
      when: not fog_installed
      async: 1800  # Timeout after 30 minutes
      poll: 0

    # Step 7: Verify FOG version (checking if it's up-to-date)
    - name: Verify FOG version
      shell: "cat /opt/fog/.fogsettings | grep fogVersion"
      register: fog_version

    - name: Display FOG version
      debug:
        msg: "FOG Server version: {{ fog_version.stdout }}"
      when: fog_installed

    # Step 8: Restart necessary services to ensure everything is up and running
    - name: Restart Apache web server
      service:
        name: apache2
        state: restarted

    - name: Restart MySQL/MariaDB
      service:
        name: mariadb
        state: restarted

    - name: Restart FOG services
      service:
        name: FOGMulticastManager
        state: restarted

    - name: Ensure FOG is running
      service:
        name: FOGMulticastManager
        state: started

